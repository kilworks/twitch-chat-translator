name: Release

# A tag vX.Y.Z builds the release and publishes it on GitHub. The stores are
# sent by hand from these zips (see .claude/skills/publish-stores): this
# repository holds no store key. Run by hand, only the build job runs: a dry run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency: release

# Each job asks for what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # preflight compares with the previous tag: it needs the tags and history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      # No install scripts in the job that builds the published zips: esbuild and vite run from their
      # platform binary packages without the postinstall (checked), and nothing else needs one.
      - run: npm ci --ignore-scripts

      - name: The tag is the version in package.json
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run release:check
      - name: Store clients against fake stores
        run: node scripts/stores/cws-selftest.mjs && node scripts/stores/amo-selftest.mjs

      # The AMO reviewer notes promise a byte-reproducible build: prove it here.
      - name: Build and pack twice, byte for byte
        run: |
          npm run package:all
          sha256sum release/*.zip > "$RUNNER_TEMP/first.sha"
          npm run package:all
          sha256sum -c "$RUNNER_TEMP/first.sha"

      - name: Source archive and store payloads
        run: |
          V=$(node -p "require('./package.json').version")
          git archive --format=zip --prefix="twitch-chat-translator-$V/" -o "release/twitch-chat-translator-$V-source.zip" HEAD
          node scripts/stores/payloads.mjs release/stores
          python3 test/audits/audit_fiche.py
          # What this release asks of a person in the Chrome dashboard, in the log
          # where the manual upload starts.
          node scripts/stores/preflight.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            release/*.zip
            release/stores
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release

      # Signed provenance: anyone can check that a zip was built by this
      # workflow from this tag, with `gh attestation verify <zip> -R <repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: release/*.zip

      - name: Release notes with checksums
        run: |
          { cat store/notes/en.txt; echo; echo '```'; (cd release && sha256sum *.zip); echo '```'; } > "$RUNNER_TEMP/release-notes.md"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          V=$(node -p "require('./package.json').version")
          cp "$BUNDLE" "release/twitch-chat-translator-$V.intoto.jsonl"
          gh release create "$GITHUB_REF_NAME" release/*.zip "release/twitch-chat-translator-$V.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
