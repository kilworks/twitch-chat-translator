name: Twitch DOM drift

# Weekly: draws live channels at random, snapshots Twitch's chat in the configs
# and surfaces the platform layer reads (native, 7TV, BTTV, FFZ; live, popout,
# embed, VOD, clip), then asks the real selectors of src/content/selectors.ts to
# find each family's list, rows, text and author (scripts/dom-drift.ts). A red
# cell is measured again on a new draw first. Red after that means a Twitch or
# 7TV update moved something the extension reads, before a reader reports it. Like stores-verify.yml, nothing is published.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # runner.temp is not available in a job's env: GitHub rejected the whole
      # file, so the weekly run never started and every push showed a failure.
      - run: echo "UX_KIT=$RUNNER_TEMP/kit" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm ci
      # The probes load Playwright from UX_KIT, outside the project's dependencies.
      - run: |
          mkdir -p "$UX_KIT"
          cp .github/uxkit/package.json .github/uxkit/package-lock.json "$UX_KIT/"
          npm ci --prefix "$UX_KIT" --no-audit --no-fund
          "$UX_KIT/node_modules/.bin/playwright" install --with-deps chromium
      - run: node scripts/fetch-chat-exts.mjs
      - run: node .agent/probes/pick.mjs 30
      - run: node .agent/probes/heat.mjs
      - name: Snapshot the cells the drift gate reads
        run: |
          CONFIGS=native,bttv,ffz,bttv+ffz,7tv,7tv+bttv,7tv+ffz,all SURFACES=live JOBS=4 node .agent/probes/matrix.mjs || true
          CONFIGS=native,7tv SURFACES=popout,embed JOBS=4 node .agent/probes/matrix.mjs || true
          CONFIGS=native,bttv,7tv,all SURFACES=vod JOBS=4 node .agent/probes/matrix.mjs || true
          CONFIGS=native SURFACES=clip JOBS=1 node .agent/probes/matrix.mjs || true
      # First reading, not gating: it lists the red cells. The probes draw their channels and VODs at
      # random, so a cell can be red for the draw and not for Twitch (2026-11-28: two runs, two
      # different sets of red cells). A cell stays red only if it fails twice, on two draws.
      - run: node scripts/dom-drift-selftest.mjs
      - run: npx tsx scripts/dom-drift.ts --fresh --failing="$RUNNER_TEMP/red.txt" || true
      - name: Measure the red cells again on a new draw
        run: |
          [ -s "$RUNNER_TEMP/red.txt" ] || { echo "no red cell, nothing to measure again"; exit 0; }
          echo "red on the first reading:"; cat "$RUNNER_TEMP/red.txt"
          node .agent/probes/pick.mjs 30
          node .agent/probes/heat.mjs
          while read -r cell; do
            CONFIGS="${cell%/*}" SURFACES="${cell#*/}" JOBS=1 OUT=matrix-again.json node .agent/probes/matrix.mjs || true
          done < "$RUNNER_TEMP/red.txt"
      # The verdict: a cell without a fresh snapshot fails here too.
      - run: npx tsx scripts/dom-drift.ts --fresh
      # Shared chat and hype chat, never seen yet: listen to the top of the directory and
      # capture the DOM of the first shared-chat session (PLAN P18). Reported, not gating.
      - run: MINUTES=15 node .agent/probes/sharedchat.mjs
        continue-on-error: true
      # The bot list of src/shared/bots.ts, re-measured (PLAN P06). Reported, not gating.
      - run: node .agent/probes/bots.mjs
        continue-on-error: true
      # The verdict and the probe reports only: the raw captures hold live chat DOM, other
      # viewers' messages, and a public repo's artifacts can be downloaded by any signed-in
      # GitHub user. Short retention, too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: recon
          path: |
            .agent/RECON/
            !.agent/RECON/**/dom.html
            !.agent/RECON/**/*.png
          retention-days: 7
