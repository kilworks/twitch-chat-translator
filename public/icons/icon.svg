<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The mark (#A970FF) with the ink T (#0E0E10): the pair the popup and options headers use. -->
  <rect width="128" height="128" rx="24" fill="#A970FF"/>
  <!-- T drawn as two rectangles, so it stays crisp at 16px and needs no font. -->
  <rect x="28" y="28" width="72" height="22" rx="4" fill="#0E0E10"/>
  <rect x="53" y="28" width="22" height="74" rx="4" fill="#0E0E10"/>
</svg>
